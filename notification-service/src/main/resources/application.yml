spring:
    application:
        name: notification-service

    datasource:
        url: jdbc:mysql://localhost:3306/graduation_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        open-in-view: false

    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest

server:
    port: 8084

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoints:
        web:
            exposure:
                include: health,info