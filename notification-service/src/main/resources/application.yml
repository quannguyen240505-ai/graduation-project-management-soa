spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/graduation_management
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info