<div class="notification-page">
  <div class="page-header">
    <div>
      <h1>Thông báo</h1>
      <p>Bạn có {{ unreadCount }} thông báo chưa đọc.</p>
    </div>

    <button type="button" class="refresh-button" (click)="loadNotifications()">
      Làm mới
    </button>
  </div>

  <div *ngIf="loading" class="message">Đang tải thông báo...</div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && notifications.length === 0" class="message">
    Bạn chưa có thông báo nào.
  </div>

  <div class="notification-list">
    <article
      *ngFor="let notification of notifications"
      class="notification-card"
      [class.unread]="!notification.read"
    >
      <div class="notification-content">
        <div class="notification-title-row">
          <h3>{{ notification.title }}</h3>

          <span class="status" [class.read]="notification.read">
            {{ notification.read ? "Đã đọc" : "Chưa đọc" }}
          </span>
        </div>

        <p>
          {{ notification.content }}
        </p>

        <small>
          {{ notification.createdAt | date: "dd/MM/yyyy HH:mm" }}
        </small>
      </div>

      <button
        *ngIf="!notification.read"
        type="button"
        class="read-button"
        (click)="markAsRead(notification.id)"
      >
        Đánh dấu đã đọc
      </button>
    </article>
  </div>
</div>
