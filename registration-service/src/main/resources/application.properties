spring.application.name=registration-service
server.port=8083


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.datasource.url=jdbc:mysql://localhost:3306/graduation_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


server.error.include-message=always

# Timeout cho REST qua Eureka; bản sửa không thêm retry mù cho thao tác ghi.
spring.cloud.openfeign.client.config.topic-service.connectTimeout=3000
spring.cloud.openfeign.client.config.topic-service.readTimeout=5000
