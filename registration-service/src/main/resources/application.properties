spring.application.name=registration-service
server.port=8083

# Kết nối Eureka Server của nhóm
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Cấu hình MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/graduation_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=291105
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hiển thị message lỗi chi tiết (phục vụ demo Fallback)
server.error.include-message=always