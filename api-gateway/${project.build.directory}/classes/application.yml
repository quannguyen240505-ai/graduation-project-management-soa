server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: auth-users
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/users/**

            - id: topic-service
              uri: lb://TOPIC-SERVICE
              predicates:
                - Path=/api/topics/**

            - id: registration-service
              uri: lb://REGISTRATION-SERVICE
              predicates:
                - Path=/api/registrations/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  issuer: graduation-project-auth
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway