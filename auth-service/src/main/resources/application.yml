server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/graduation_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  issuer: graduation-project-auth
  secret: ${JWT_SECRET}
  expiration-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
