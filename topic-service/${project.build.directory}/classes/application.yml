server:
    port: 8082

spring:
    application:
        name: topic-service

    datasource:
        url: jdbc:mysql://localhost:3306/graduation_management
        username: root
        password: ${DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false

eureka:
    instance:
        hostname: localhost
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoints:
        web:
            exposure:
                include: health,info
jwt:
    issuer: graduation-project-auth
    secret: ${JWT_SECRET}
